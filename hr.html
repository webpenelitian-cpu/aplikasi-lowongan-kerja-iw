<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdnjs.cloudflare.com https://www.gstatic.com https://apis.google.com https://www.google.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://www.gstatic.com; connect-src 'self' blob: https://cdnjs.cloudflare.com https://*.googleapis.com https://*.firebaseio.com https://*.firebaseapp.com https://www.google.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://www.google.com https://recaptcha.google.com; worker-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin">
<meta name="robots" content="noindex">
<title>Lowongan Kerja HR</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b3558">
</head>
<body>
<a class="skip noprint" href="#app">Langsung ke isi</a>
<header class="top noprint">
  <div class="top-in">
    <button type="button" class="brand" data-act="home"><b aria-hidden="true">LK</b><span>Lowongan Kerja<small>Ruang kerja HR</small></span></button>
    <div class="inline">
      <span id="sync" role="status"></span>
      <button type="button" id="btn-refresh" data-act="refresh" hidden>Muat data terbaru</button>
      <button type="button" data-act="backup">Cadangkan data</button>
      <button type="button" id="btn-restore" data-act="restore">Pulihkan data</button>
      <button type="button" id="btn-logout" data-act="logout" hidden>Keluar</button>
      <input id="restore-file" type="file" accept=".json" hidden>
    </div>
  </div>
</header>
<p id="banner" class="banner noprint" role="alert" hidden></p>
<main id="app" class="wrap" tabindex="-1"></main>
<footer id="foot" class="wrap foot noprint">Data pelamar tersimpan hanya di browser perangkat ini dan tidak dikirim ke server. Cadangkan secara berkala, dan hapus data lowongan yang sudah selesai.</footer>

<dialog id="pw" aria-labelledby="pw-judul">
  <h2 id="pw-judul"></h2>
  <p id="pw-hint" class="hint"></p>
  <label for="pw-in">Kata sandi</label>
  <input id="pw-in" type="password" autocomplete="new-password">
  <p id="pw-err" class="warn" role="alert" hidden></p>
  <div class="inline"><button type="button" id="pw-ok">Lanjutkan</button><button type="button" class="ghost" id="pw-no">Batal</button></div>
</dialog>

<script src="firebase-config.js"></script>
<script src="cloud.js"></script>
<script src="baca-cv.js"></script>
<script src="screening.js"></script>
<script src="rekrutmen.js"></script>
<script src="templat-lowongan.js"></script>
<script src="app.js"></script>
</body>
</html>
